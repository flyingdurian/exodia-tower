<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exodia Tower Automation Demo</title>
<style>:root{color-scheme:dark;font:16px system-ui;background:#07101c;color:#e1f8ff}main{max-width:770px;margin:70px auto;padding:28px;background:#0e2137;border:1px solid #305671;border-radius:18px}h1{margin:0 0 10px}p{color:#a5c1d0}.editor{background:#07111e;border:1px solid #6090aa;min-height:100px;padding:20px;border-radius:12px}button{padding:13px 24px;margin-top:13px;background:#70e0d5;color:#092b31;border:0;border-radius:9px;font-weight:700}.demo-response{margin-top:25px;padding:20px;min-height:50px;background:#06101f;border:1px solid #32637c;white-space:pre-wrap}#demo-stop{margin-left:12px;background:#bd8b63}</style></head><body><main><small>EXODIA TOWER / LOCAL DEVELOPMENT TEST</small><h1>Authorized Browser Automation Demo</h1><p>This page simulates a streaming response. It is <b>not</b> an LLM. It verifies automated typing, submission, streaming detection and companion delivery.</p><div id="demo-input" class="editor" contenteditable="true" role="textbox" aria-label="Demo prompt"></div><button id="demo-send">Send prompt</button><button id="demo-stop" hidden>Stop generating</button><div class="demo-response" aria-live="polite" hidden></div></main><script>
const input=document.querySelector('#demo-input'),send=document.querySelector('#demo-send'),stop=document.querySelector('#demo-stop'),out=document.querySelector('.demo-response');let timer;
send.onclick=()=>{if(!input.textContent.trim())return;clearInterval(timer);out.hidden=false;out.textContent='';stop.hidden=false;send.disabled=true;
let message='AUTOMATION DEMO RESPONSE: Your task was submitted successfully. The companion has received this simulated answer. Input: '+input.textContent.trim();let n=0;
timer=setInterval(()=>{n=Math.min(message.length,n+12);out.textContent=message.slice(0,n);if(n===message.length){clearInterval(timer);stop.hidden=true;send.disabled=false}},90)};
stop.onclick=()=>{clearInterval(timer);stop.hidden=true;send.disabled=false};
</script></body></html>
